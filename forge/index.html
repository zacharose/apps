<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f4f1; --surf:#ffffff; --surf2:#efebe6; --line:#ddd6cd;
  --ink:#1d1a17; --ink2:#5d564e; --ink3:#8d847a;
  --accent:#8a5a2b; --accent2:#a8703a;
  --water:#2c6e8f; --salt:#7a6a2f; --food:#5c6b3a; --lift:#8a3b3b;
  --ok:#3f6b42;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13110f; --surf:#1c1916; --surf2:#252017; --line:#332d26;
    --ink:#ece7e0; --ink2:#a89f93; --ink3:#776e63;
    --accent:#c89050; --accent2:#dba966;
    --water:#64b0d6; --salt:#cbb45e; --food:#9cb86a; --lift:#d47a7a;
    --ok:#7fb183;
  }
}
:root[data-theme="dark"]{
  --bg:#13110f; --surf:#1c1916; --surf2:#252017; --line:#332d26;
  --ink:#ece7e0; --ink2:#a89f93; --ink3:#776e63;
  --accent:#c89050; --accent2:#dba966;
  --water:#64b0d6; --salt:#cbb45e; --food:#9cb86a; --lift:#d47a7a;
  --ok:#7fb183;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,-apple-system,"SF Pro Text",system-ui,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}

/* layout */
.wrap{max-width:560px;margin:0 auto;padding:0 14px 108px}
header{padding:16px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{font-size:19px;margin:0;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
h1 span{color:var(--accent)}
.date{font-size:12px;color:var(--ink3);letter-spacing:.06em}

.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px;font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.grow{flex:1;min-width:0}

/* meters */
.meter{height:9px;border-radius:5px;background:var(--surf2);overflow:hidden;margin:7px 0 4px}
.meter i{display:block;height:100%;border-radius:5px;transition:width .35s ease}
.big{font-size:27px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.unit{font-size:12px;color:var(--ink3);font-weight:400;letter-spacing:.04em}
.sub{font-size:12.5px;color:var(--ink2)}

/* buttons */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{
  padding:9px 13px;border-radius:999px;background:var(--surf2);
  border:1px solid var(--line);font-size:13.5px;font-weight:550;
  min-height:40px;display:inline-flex;align-items:center;
}
.chip:active{transform:scale(.96)}
.chip.w{color:var(--water)} .chip.s{color:var(--salt)} .chip.f{color:var(--food)}
.btn{
  display:block;width:100%;padding:13px;border-radius:11px;text-align:center;
  background:var(--accent);color:#fff;font-weight:600;font-size:15px;min-height:46px;
}
:root[data-theme="dark"] .btn,
:root:not([data-theme="light"]) .btn{color:#17120c}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn{color:#fff}}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
:root .btn.ghost,:root:not([data-theme="dark"]) .btn.ghost,:root:not([data-theme="light"]) .btn.ghost{color:var(--ink)}
.btn.sm{padding:9px;font-size:13.5px;min-height:38px}

/* tabs */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb,var(--surf) 94%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 4px);padding-top:4px;
}
nav button{flex:1;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);min-height:50px}
nav button.on{color:var(--accent)}
nav .lbl{font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:600}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* workouts */
.wk{background:var(--surf);border:1px solid var(--line);border-radius:14px;margin-bottom:11px;overflow:hidden}
.wk>summary{padding:14px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
.wk>summary::-webkit-details-marker{display:none}
.wk .tag{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.wk .nm{font-weight:600;font-size:16px}
.wk .dur{margin-left:auto;font-size:12px;color:var(--ink3);white-space:nowrap}
.wkbody{padding:0 14px 14px;border-top:1px solid var(--line);margin-top:2px;padding-top:12px}

.mv{padding:13px 0;border-bottom:1px solid var(--line)}
.mv:last-child{border-bottom:none;padding-bottom:0}
.mv .hd{display:flex;align-items:baseline;gap:9px;margin-bottom:5px}
.mv .n{font-weight:600;font-size:15px;flex:1}
.mv .sets{font-size:12.5px;color:var(--accent);font-weight:600;white-space:nowrap}
.mv .cue{font-size:13.5px;color:var(--ink2);margin:5px 0}
.fig{background:var(--surf2);border-radius:10px;padding:9px;margin:9px 0 7px}
.fig svg{width:100%;height:auto;display:block}
.vid{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
  color:var(--water);text-decoration:none;padding:7px 11px;border:1px solid var(--line);
  border-radius:999px;background:var(--surf2);min-height:36px;
}
.warn{
  background:color-mix(in srgb,var(--lift) 11%,transparent);
  border-left:3px solid var(--lift);padding:10px 12px;border-radius:0 8px 8px 0;
  font-size:13px;margin:10px 0;color:var(--ink);
}
.note{font-size:12.5px;color:var(--ink3);font-style:italic;margin-top:8px}

/* inputs */
label{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin:13px 0 5px;font-weight:600}
input,select{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--surf2);font-size:16px;min-height:44px;
}
textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surf2);font:inherit;font-size:16px;color:inherit;min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* log */
.le{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:flex-start}
.le:last-child{border-bottom:none}
.le .d{font-size:11px;color:var(--ink3);width:52px;flex-shrink:0;padding-top:2px;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--ink3);padding:30px 14px;font-size:14px}
/* focus mode — one thing at a time */
#focus{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;
  flex-direction:column;padding:env(safe-area-inset-top,0px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
#focus.on{display:flex}
.fbar{display:flex;align-items:center;justify-content:space-between;padding:12px 0 4px;flex-shrink:0}
.fbar button{font-size:14px;color:var(--ink3);padding:8px;min-height:40px;font-weight:600}
.fdots{display:flex;gap:5px}
.fdots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.fdots i.on{background:var(--accent)}
.fdots i.past{background:var(--ink3)}
.fmid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
.fname{font-size:27px;font-weight:650;letter-spacing:-.02em;line-height:1.15;margin:6px 0 4px}
.fsets{font-size:16px;color:var(--accent);font-weight:600;margin-bottom:12px}
.fcue{font-size:15.5px;color:var(--ink2);line-height:1.55;margin-top:14px}
.fclock{font-size:62px;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;line-height:1;margin:14px 0 10px;color:var(--ink)}
.fclock.run{color:var(--accent)}
.fpre{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.fpre button{padding:8px 14px;border-radius:999px;background:var(--surf2);border:1px solid var(--line);
  font-size:13px;font-weight:600;min-height:38px}
.fpre button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.fnav{display:flex;gap:9px;flex-shrink:0;padding-top:10px}
.fnav .btn{margin:0}
.fnav .back{flex:0 0 78px}
.fdone{text-align:center;padding:34px 10px}
.fdone .big{font-size:34px;margin-bottom:6px}
.hidden{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>

    <h1>For<span>ge</span></h1>

<script>
"use strict";

/* ---------------- storage ---------------- */
var KEY = "forge.v1";
var S = {
  bw: 200, protTarget: 0.8, heat: "mod", theme: "auto",
  days: {}, sessions: [], cardio: [], custom: []
};
function load(){
  try{
    var r = localStorage.getItem(KEY);
    if(r){ var p = JSON.parse(r); for(var k in p){ if(Object.prototype.hasOwnProperty.call(p,k)) S[k]=p[k]; } }
  }catch(e){ /* private mode or cleared — run on defaults */ }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ /* quota or blocked — session still works */ }
}
load();
if(!Array.isArray(S.custom)) S.custom = [];

/* The day rolls over at 4am LOCAL time (it used to be midnight UTC, which filed
   anything after 7pm Central onto tomorrow). A 1am session still belongs to tonight. */
function ymd(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function key(d){ return ymd(new Date((d ? d.getTime() : Date.now()) - 4*3600000)); }
function prevKey(k){ var p = k.split("-"); return ymd(new Date(+p[0], +p[1]-1, +p[2]-1, 12)); }
function daysBetween(a, b){
  var x = a.split("-"), y = b.split("-");
  return Math.round((new Date(+y[0],+y[1]-1,+y[2],12) - new Date(+x[0],+x[1]-1,+x[2],12))/86400000);
}
function day(k){
  k = k || key();
  if(!S.days[k]) S.days[k] = {water:0, sodium:0, protein:0, kcal:0};
  return S.days[k];
}

/* ---------------- targets ---------------- */
function waterTarget(){
  var base = S.bw * 0.5;                       // oz, ~half bodyweight
  var add = {low:0, mod:24, high:48}[S.heat] || 24;
  return Math.round(base + add);
}
function sodiumTarget(){
  return {low:2300, mod:3500, high:5000}[S.heat] || 3500;
}
function proteinTarget(){ return Math.round(S.bw * S.protTarget); }

/* ---------------- figures ---------------- */
var DUR = 3.2;

function sty(o){
  var t = '';
  if(o.c)    t += ' style="color:var(--'+o.c+')"';
  if(o.w)    t += ' stroke-width="'+o.w+'"';
  if(o.dash) t += ' stroke-dasharray="'+o.dash+'"';
  return t;
}
/* values A -> B -> A, eased both ways */
function anim(attr,a,b,dur){
  return '<animate attributeName="'+attr+'" values="'+a+';'+b+';'+a+'" '+
    'dur="'+(dur||DUR)+'s" repeatCount="indefinite" calcMode="spline" '+
    'keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>';
}
function mp(a,b,o){ o=o||{}; return '<path d="'+a+'"'+sty(o)+'>'+anim('d',a,b,o.dur)+'</path>'; }
function mc(r,x1,y1,x2,y2,o){ o=o||{};
  return '<circle r="'+r+'" cx="'+x1+'" cy="'+y1+'"'+sty(o)+'>'+
    anim('cx',x1,x2,o.dur)+anim('cy',y1,y2,o.dur)+'</circle>'; }
function sp(d,o){ o=o||{}; return '<path d="'+d+'"'+sty(o)+'/>'; }
function sc(r,x,y,o){ o=o||{}; return '<circle r="'+r+'" cx="'+x+'" cy="'+y+'"'+sty(o)+'/>'; }
/* steady pressure, no movement — for the isometrics */
function pulse(d,o){ o=o||{};
  return '<path d="'+d+'"'+sty(o)+'><animate attributeName="opacity" '+
    'values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></path>'; }
/* continuous revolution about a grip point */
function spin(cx,cy,dur,content,rev){
  return '<g><animateTransform attributeName="transform" type="rotate" '+
    'from="'+(rev?360:0)+' '+cx+' '+cy+'" to="'+(rev?0:360)+' '+cx+' '+cy+'" '+
    'dur="'+dur+'s" repeatCount="indefinite"/>'+content+'</g>'; }

    'style="color:var(--ink2)">'+body+'</g></svg>';
}
function gnd(y,x1,x2){
  return '<path d="M'+(x1||10)+' '+y+'H'+(x2||290)+'" stroke-dasharray="3 5" stroke-width="1.6" style="color:var(--ink3)"/>';
}

var actx = null;
function beep(n, hz){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    for(var i=0;i<(n||1);i++){
      var o=actx.createOscillator(), g=actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.type="sine"; o.frequency.value = hz || 880;
      var t = actx.currentTime + i*0.2;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.3,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
      o.start(t); o.stop(t+0.18);
    }
  }catch(e){}
}

/* read a sensible default timer out of the prescription text */
function guessTimer(txt){
  if(/EMOM/i.test(txt)) return {sec:60, lbl:"Every minute"};
  var m = txt.match(/(\d+)\s*s\b/);        if(m) return {sec:+m[1], lbl:"Hold"};
  m = txt.match(/(\d+)(?:–|-)?\d*\s*min/); if(m) return {sec:+m[1]*60, lbl:"Work"};
  return null;
}
function mmss(s){
  s = Math.max(0, Math.round(s));
  return Math.floor(s/60) + ":" + ("0"+(s%60)).slice(-2);

function startFocus(kind, id){
  var wid = kind==="n" ? (id==="floor" ? "floor" : "spine") : id;

                       : WORKOUTS.filter(function(x){return x.id===wid;})[0];
  if(!src) return;
  FX.on=true; FX.kind=kind; FX.id=id; FX.i=0; FX.elapsed=0; FX.t0=Date.now(); FX.logged=false;
  FX.items = kind==="c" ? [src] : src.moves.slice();

  stopTimer();
  if(logIt && FX.kind==="n"){
    logNight();
  } else if(logIt && FX.kind==="w"){
    S.sessions.push({w:FX.id, t:Date.now()});
  } else if(logIt && FX.kind==="c"){
    var mins = Math.max(1, Math.round((Date.now()-FX.t0)/60000));
    var map = {ruck:"ruck", longruck:"ruck", spin:"bike", tempo:"bike", walkrun:"run", walk:"walk"};
    S.cardio.push({t:Date.now(), a:map[FX.id]||"walk", min:mins, mi:0, lb:0, e:2});

function stopTimer(){ if(FX.iv){ clearInterval(FX.iv); FX.iv=null; } FX.run=false; }
function tickTimer(){
  var el = document.getElementById("fclock"); if(!el) return;
  if(FX.up){ FX.sec++; el.textContent = mmss(FX.sec); }
  else {
    FX.sec--;
    el.textContent = mmss(FX.sec);
    if(FX.sec<=0){ stopTimer(); beep(2); el.classList.remove("run"); fxNav(); }
  }
}
function toggleTimer(){
  var el = document.getElementById("fclock");

  else {
    if(!FX.up && FX.sec<=0) return;
    FX.run=true; if(el) el.classList.add("run");
    beep(1,660);

function suggest(){
  var today = key(), now = Date.now();
  var didElbow = S.sessions.some(function(x){ return x.w==="elbow" && key(new Date(x.t))===today; });
  if(!didElbow) return {kind:"w", id:"elbow"};
  var best=null, oldest=-1;
  ["legs","mace","full","bw"].forEach(function(id){
    var t = 0;
    S.sessions.forEach(function(x){ if(x.w===id && x.t>t) t=x.t; });
    var age = now - t;
    if(age > oldest){ oldest = age; best = id; }
  });
  var liftToday = S.sessions.some(function(x){ return x.w!=="spine" && x.w!=="floor" && key(new Date(x.t))===today; });
  if(liftToday) return {kind:"c", id:"walk"};
  return {kind:"w", id:best||"full"};
}

      '<button class="chip s" data-a="bottle">Log it</button>'+
    '</div>'+
    '<div class="mv" style="padding-top:4px">'+
      '<div class="cue">'+
      'Sodium <strong>'+m.na+' mg</strong> &nbsp;·&nbsp; Potassium <strong>'+m.k+' mg</strong><br>'+
      'Sugar <strong>'+m.sugar+' g</strong> &nbsp;·&nbsp; '+m.kcal+' kcal'+
      '</div>'+
    '</div>'+

    '<div class="warn"><strong>Why the extra salt.</strong> '+
    'Mixed at 80 g per litre the base delivers about <strong>718 mg of sodium per litre</strong> — a well-built sports drink, near double Gatorade. '+
    'But salty sweat runs 1,500–2,000 mg per litre, so on a hot day the base replaces roughly half of what you lose. '+
    'The potassium needs no help: 187 mg per litre lands right on sweat losses. It is sodium alone that falls short, '+
    'and a salt shaker in the truck fixes it without touching the batch.</div>'+

    '<h2 style="margin-top:16px">Season by season</h2>'+
    '<table style="width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px">'+
    '<tr style="color:var(--ink3);font-size:11px;letter-spacing:.07em;text-transform:uppercase">'+
      '<td style="padding-bottom:5px">Season</td><td>Scoop</td><td>Add</td><td style="text-align:right">Sodium</td></tr>'+
    ['low','mod','high'].map(function(kk){
      var x = MIX[kk], on = (kk===S.heat);
      return '<tr style="border-top:1px solid var(--line);'+(on?'color:var(--accent);font-weight:600':'')+'">'+
        '<td style="padding:7px 0">'+esc(x.season.split(" ·")[0])+'</td>'+
        '<td>'+esc(x.scoop)+'</td>'+
        '<td>'+(x.addSalt==="none"?"—":esc(x.addSalt))+'</td>'+
        '<td style="text-align:right">'+x.na+' mg</td></tr>';
    }).join('')+
    '</table>'+
    '<div class="note">'+esc(m.per)+' Change the season in Setup and this moves with it.</div>'+

    '<h2 style="margin-top:18px">Two things worth knowing</h2>'+
    '<div class="mv" style="padding-top:4px">'+
      '<div class="hd"><div class="n">Check which sodium citrate you bought</div></div>'+
      '<div class="cue">Dihydrate and anhydrous are both sold as plain &ldquo;sodium citrate,&rdquo; and they are not the same. '+
      'Dihydrate carries 23.4% sodium, anhydrous 26.7% — about 75 mg per bottle between them. '+
      'The numbers above assume dihydrate, which is what most food-grade bags are. If yours says anhydrous, you are running slightly saltier than shown, which in your case is no bad thing.</div>'+
    '</div>'+
    '<div class="mv">'+
      '<div class="hd"><div class="n">Your 60 g scoop runs concentrated</div></div>'+
      '<div class="cue">60 g in a 22 oz bottle works out to 92 g per litre, not 80 — an 8.8% carb solution where the absorption window is 6–8%. '+
      'Past about 8% the stomach empties slower, which is the opposite of what you want in an attic. '+
      'Dropping to 52 g lands you at 8.0%, or keep the 60 g and the bottle takes a little longer to hit. Not a problem, just a dial.</div>'+
    '</div>'+

    '<div class="warn"><strong>The potassium question.</strong> '+
    'If you have any kidney trouble, or take a blood pressure medication — ACE inhibitors, ARBs, or a potassium-sparing diuretic like spironolactone — '+
    'supplemental potassium can accumulate in a way that matters. Worth one conversation with a doctor before you are drinking it daily.</div>'+

    '<h2 style="margin-top:18px">Are you actually a salty sweater?</h2>'+
    '<div class="sub">White crust on a hat brim, salt rings dried into a shirt, sweat that stings the eyes and tastes sharp. '+
    'It is a fixed trait rather than something that trains away, and it runs roughly double the sodium loss of an average sweater — '+
    'which is exactly why every commercial mix is built for someone else.</div>'+

    '</div></details>';
}

function vWork(){

    '<div class="sub">Spine &amp; Neck (or the 2-minute Spine Floor) is the nightly anchor &mdash; start it from Today. Pick two of the others per week — the nights before a day off, late, when the house is down. '+
    'Two sessions you actually do beats six you don\'t.</div></div>';
  h += WORKOUTS.map(function(w){
    return '<details class="wk"><summary>'+
      '<div class="grow"><div class="tag">'+esc(w.tag)+'</div><div class="nm">'+esc(w.name)+'</div></div>'+
      '<div class="dur">'+esc(w.dur)+'</div></summary>'+
      '<div class="wkbody">'+
      '<div class="sub" style="margin-bottom:4px">'+esc(w.intro)+'</div>'+
      (w.warn ? '<div class="warn"><strong>Care.</strong> '+esc(w.warn)+'</div>' : '')+
      w.moves.map(function(m){
        return '<div class="mv">'+
          '<div class="hd"><div class="n">'+esc(m.n)+'</div><div class="sets">'+esc(m.s)+'</div></div>'+
          '<div class="fig">'+m.f+'</div>'+
          '<div class="cue">'+esc(m.cue)+'</div>'+
          '<a class="vid" href="'+v(m.v)+'" target="_blank" rel="noopener">'+
          '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Watch form</a>'+
        '</div>';
      }).join("")+
      '<button class="btn" data-a="go" data-k="w" data-i="'+w.id+'" style="margin-top:14px">Start guided</button>'+
      '<button class="btn ghost sm" data-a="done" data-w="'+w.id+'" style="margin-top:7px">Just log it</button>'+
      '</div></details>';

  return h + vCardio();
}


function vCardio(){
  var lr = lastOf("ruck"), wt = weekTotals();
  var h = '<div class="card" style="margin-top:18px"><h2>Cardio</h2>'+
    '<div class="sub">Two or three of these a week alongside the lifting. The easy ones are not filler — '+
    'steady aerobic work is what makes a long day on your feet stop being a long day.</div>'+
    (wt.n ? '<div class="row sb" style="margin-top:12px">'+
      '<div><div class="big">'+wt.min+'<span class="unit"> min</span></div><div class="sub">last 7 days</div></div>'+
      '<div><div class="big">'+(Math.round(wt.mi*10)/10)+'<span class="unit"> mi</span></div><div class="sub">'+wt.n+' session'+(wt.n==1?'':'s')+'</div></div>'+
      '</div>' : '')+
    '</div>';

  h += CARDIO.map(function(c){
    var extra = "";
    if(c.id==="ruck" && lr){
      extra = '<div class="note" style="margin-top:10px">Last ruck: <strong>'+
        (lr.lb?lr.lb+' lb, ':'')+lr.min+' min</strong> — '+daysAgo(lr.t)+'. '+
        (lr.lb && lr.lb>=35 ? 'At the top of the useful range; add minutes rather than pounds.' :
         'Hold it three or four weeks, then add 5 lb or 10 minutes — one, not both.')+'</div>';
    }
    return '<details class="wk"><summary>'+
      '<div class="grow"><div class="tag">'+esc(c.tag)+'</div><div class="nm">'+esc(c.name)+'</div></div>'+
      '<div class="dur">'+esc(c.dur)+'</div></summary>'+
      '<div class="wkbody">'+
      '<div class="fig">'+F[c.f]+'</div>'+
      '<div class="sub" style="margin-bottom:8px">'+esc(c.intro)+'</div>'+
      '<ul style="margin:0;padding-left:17px">'+
        c.pts.map(function(x){ return '<li class="sub" style="margin-bottom:5px">'+esc(x)+'</li>'; }).join('')+
      '</ul>'+ extra +
      '<button class="btn" data-a="go" data-k="c" data-i="'+c.id+'" style="margin-top:14px">Start &amp; time it</button>'+
      '</div></details>';
  }).join("");

  h += '<details class="wk"><summary>'+
    '<div class="grow"><div class="tag">Record it</div><div class="nm">Log a Session</div></div>'+
    '<div class="dur">&#43;</div></summary>'+
    '<div class="wkbody">'+
      '<label for="cact">Activity</label>'+
      '<select id="cact">'+
        '<option value="ruck">Ruck</option><option value="bike">Bike</option>'+
        '<option value="run">Run</option><option value="walk">Walk</option>'+
      '</select>'+
      '<div class="row" style="gap:9px">'+
        '<div class="grow"><label for="cmin">Minutes</label>'+
        '<input id="cmin" type="number" inputmode="numeric" placeholder="45"></div>'+
        '<div class="grow"><label for="cmi">Miles</label>'+
        '<input id="cmi" type="number" inputmode="decimal" placeholder="optional"></div>'+
      '</div>'+
      '<div class="row" style="gap:9px">'+
        '<div class="grow"><label for="clb">Pack (lb)</label>'+
        '<input id="clb" type="number" inputmode="numeric" placeholder="ruck only"></div>'+
        '<div class="grow"><label for="ceff">Effort</label>'+
        '<select id="ceff"><option value="1">Easy — full conversation</option>'+
        '<option value="2" selected>Steady — short sentences</option>'+
        '<option value="3">Hard — cannot talk</option></select></div>'+
      '</div>'+
      '<button class="btn" data-a="clog" style="margin-top:14px">Save session</button>'+
      '<div class="note">Effort is the talk test, which beats a heart-rate number you are not wearing. '+
      'On gravel, log minutes and ignore the miles — the surface sets your speed, not your fitness.</div>'+
    '</div></details>';
  return h;
}

function vLog(){
  var names = [];
  S.custom.forEach(function(x){ if(names.indexOf(x.n)<0) names.push(x.n); });
  var h = '<div class="card"><h2>Log an exercise</h2>'+
    '<label for="xn">Exercise</label>'+
    '<input id="xn" type="text" list="xnames" autocomplete="off" autocapitalize="words" placeholder="Kettlebell swings, stretching, yard work…">'+
    '<datalist id="xnames">'+names.map(function(n){ return '<option value="'+esc(n)+'">'; }).join('')+'</datalist>'+
    '<label for="xm">Duration (minutes)</label>'+
    '<input id="xm" type="number" inputmode="numeric" min="1" placeholder="20">'+
    '<label for="xt">Notes</label>'+
    '<textarea id="xt" placeholder="How it went, what to change next time"></textarea>'+
    '<button class="btn" data-a="xlog" style="margin-top:14px">Save exercise</button>'+
  '</div>';

  h += '<div class="card"><h2>Exercise log</h2>';
  if(!S.custom.length){
    h += '<div class="empty">Nothing logged yet.</div>';
  } else {
    h += S.custom.slice().reverse().slice(0,60).map(function(x){
      var dt = new Date(x.t);
      return '<div class="le"><div class="d">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</div>'+
        '<div class="grow"><strong>'+esc(x.n)+'</strong> &middot; '+x.min+' min'+
        (x.note ? '<br><span class="sub" style="white-space:pre-wrap">'+esc(x.note)+'</span>' : '')+
        '</div><button class="btn ghost sm" data-a="xdel" data-t="'+x.t+'" aria-label="Delete entry" style="width:auto;min-height:32px;padding:4px 10px">&times;</button></div>';
    }).join("");
  }
  h += '</div>';

  h += '<div class="card"><h2>Sessions</h2>';
  if(!S.sessions.length){
    h += '<div class="empty">Nothing logged yet.<br>Finish a session and tap <em>Log this session</em>.</div>';
  } else {
    h += S.sessions.slice().reverse().slice(0,60).map(function(e){
      var w = WORKOUTS.filter(function(x){return x.id===e.w;})[0];
      var dt = new Date(e.t);
      return '<div class="le"><div class="d">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</div>'+
        '<div class="grow"><strong>'+esc(w?w.name:e.w)+'</strong><br>'+
        '<span class="sub">'+dt.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})+'</span></div></div>';
    }).join("");
  }
  h += '</div>';

  var wt = weekTotals();
  h += '<div class="card"><h2>Cardio</h2>';
  if(!S.cardio.length){
    h += '<div class="empty">No cardio logged yet.</div>';
  } else {
    h += '<div class="row sb" style="margin-bottom:10px">'+
      '<div><div class="big">'+wt.min+'<span class="unit"> min</span></div><div class="sub">this week</div></div>'+
      '<div><div class="big">'+(Math.round(wt.mi*10)/10)+'<span class="unit"> mi</span></div><div class="sub">this week</div></div>'+
      '</div>';
    h += S.cardio.slice().reverse().slice(0,40).map(function(c){
      var dt = new Date(c.t);
      return '<div class="le"><div class="d">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</div>'+
        '<div class="grow"><strong>'+(ACT[c.a]||c.a)+'</strong> &middot; '+c.min+' min'+
        (c.mi?' &middot; '+c.mi+' mi':'')+(c.lb?' &middot; '+c.lb+' lb':'')+
        '<br><span class="sub">'+(EFF[c.e]||'')+'</span></div></div>';
    }).join("");
  }
  h += '</div>';

  var ks = Object.keys(S.days).sort().reverse().slice(0,14);
  h += '<div class="card"><h2>Intake — last 14 days</h2>';
  if(!ks.length){ h += '<div class="empty">No intake logged yet.</div>'; }
  else {
    h += ks.map(function(k){
      var d = S.days[k], p = k.split("-");
      return '<div class="le"><div class="d">'+Number(p[1])+'/'+Number(p[2])+'</div>'+
        '<div class="grow sub">'+
        '<span style="color:var(--water)">'+Math.round(d.water)+' oz</span> · '+
        '<span style="color:var(--salt)">'+Math.round(d.sodium)+' mg</span> · '+
        '<span style="color:var(--food)">'+Math.round(d.protein)+' g</span>'+
        '</div></div>';
    }).join("");
  }
  h += '</div>';

  var n = S.sessions.length;
  h += '<div class="card"><h2>Totals</h2><div class="row sb">'+
    '<div><div class="big">'+n+'</div><div class="sub">sessions</div></div>'+
    '<div><div class="big">'+ks.length+'</div><div class="sub">days logged</div></div>'+
    '</div></div>';

  h += '<button class="btn ghost sm" data-a="export" style="margin-bottom:10px">Export backup (JSON)</button>';
  h += '<div class="note">Everything lives in this browser on this phone — nothing is sent anywhere. Clearing Safari data wipes it, so export now and then.</div>';
  return h;
}

function vSet(){
  return ''+
  '<div class="card">'+
    '<label for="bw">Bodyweight (lb)</label>'+
    '<input id="bw" type="number" inputmode="decimal" value="'+S.bw+'">'+
    '<label for="pt">Protein target (g per lb)</label>'+
    '<select id="pt">'+
      '<option value="0.6"'+(S.protTarget==0.6?" selected":"")+'>0.6 — maintenance</option>'+
      '<option value="0.8"'+(S.protTarget==0.8?" selected":"")+'>0.8 — training (default)</option>'+
      '<option value="1"'+(S.protTarget==1?" selected":"")+'>1.0 — building</option>'+
    '</select>'+
    '<label for="heat">Season &amp; conditions</label>'+
    '<select id="heat">'+
      '<option value="low"'+(S.heat=="low"?" selected":"")+'>Winter — indoor, light sweat</option>'+
      '<option value="mod"'+(S.heat=="mod"?" selected":"")+'>Spring / Fall — mixed</option>'+
      '<option value="high"'+(S.heat=="high"?" selected":"")+'>Summer — attics, heavy sweat</option>'+
    '</select>'+
    '<div class="note" style="margin-top:6px">Drives both your intake targets and the mix recipe. Move it when the weather turns.</div>'+
    '<label for="th">Appearance</label>'+
    '<select id="th">'+
      '<option value="auto"'+(S.theme=="auto"?" selected":"")+'>Match phone</option>'+
      '<option value="dark"'+(S.theme=="dark"?" selected":"")+'>Always dark</option>'+
      '<option value="light"'+(S.theme=="light"?" selected":"")+'>Always light</option>'+
    '</select>'+
    '<button class="btn" data-a="savecfg" style="margin-top:16px">Save</button>'+
  '</div>'+
  '<div class="card"><h2>Install on iPhone</h2><div class="sub">'+
  'Safari → Share → <strong>Add to Home Screen</strong>. It opens full screen with no address bar, and keeps working without signal. '+
  'It has to be Safari — Chrome on iOS can\'t install it.</div></div>'+
  '<div class="card"><h2>Targets right now</h2><div class="sub">'+
  'Water <strong>'+waterTarget()+' oz</strong> · Sodium <strong>'+sodiumTarget()+' mg</strong> · Protein <strong>'+proteinTarget()+' g</strong><br><br>'+
  'Water starts at half your bodyweight in ounces and adds for sweat. Sodium is the one most people miss — a hard sweating day can run a litre of sweat an hour, '+
  'and sweat carries roughly 1,000 mg of sodium per litre.</div></div>'+
  '<div class="card"><h2>Honest limits</h2><div class="sub">'+
  'These are general numbers, not medical advice, and they assume healthy kidneys and no blood-pressure medication. '+
  'If you take anything that affects fluid or salt balance, the sodium target is a conversation for your doctor, not an app.</div></div>';
}

function render(){
  var el = document.getElementById("view");
  el.innerHTML = tab==="today" ? vToday() : tab==="work" ? vWork() : tab==="log" ? vLog() : vSet();
  var n = document.getElementById("nav").children;
  for(var i=0;i<n.length;i++){ n[i].classList.toggle("on", n[i].dataset.t===tab); }
  window.scrollTo(0,0);
}

/* ---------------- events ---------------- */
document.getElementById("nav").addEventListener("click", function(e){
  var b = e.target.closest("button[data-t]"); if(!b) return;
  tab = b.dataset.t; render();
});

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-a]"); if(!b) return;
  var a = b.dataset.a, d = day();

  if(a==="w"){ d.water += +b.dataset.v; save(); render(); }
  else if(a==="s"){ d.sodium += +b.dataset.v; save(); render(); }
  else if(a==="f"){ d.protein += +b.dataset.p; d.kcal += +(b.dataset.k||0); save(); render(); }
  else if(a==="fc"){
    var p = +(document.getElementById("pcust").value||0), k = +(document.getElementById("kcust").value||0);
    if(p||k){ d.protein += p; d.kcal += k; save(); render(); }
  }
  else if(a==="go"){ startFocus(b.dataset.k, b.dataset.i); }
  else if(a==="night"){ startFocus("n", b.dataset.m); }
  else if(a==="tab"){ tab = b.dataset.t; render(); }
  else if(a==="fx"){ endFocus(false); }
  else if(a==="fnext"){ fxGo(1); }
  else if(a==="fprev"){ fxGo(-1); }
  else if(a==="fskip"){ fxGo(1); }
  else if(a==="ftimer"){ toggleTimer(); }
  else if(a==="fset"){ stopTimer(); FX.sec = +b.dataset.s; FX.up=false;
    var c=document.getElementById("fclock"); if(c){ c.textContent=mmss(FX.sec); c.classList.remove("run"); }
    var ps=document.querySelectorAll('.fpre button');
    for(var i=0;i<ps.length;i++) ps[i].classList.toggle("on", ps[i].dataset.s===b.dataset.s);
    fxNav();
  }
  else if(a==="bottle"){ var mx=mix(); d.water += 22; d.sodium += mx.na; d.kcal += mx.kcal; save(); render(); }
  else if(a==="reset"){
    if(confirm("Clear today's water, sodium and food?")){ S.days[key()] = {water:0,sodium:0,protein:0,kcal:0}; save(); render(); }
  }
  else if(a==="done"){
    S.sessions.push({w:b.dataset.w, t:Date.now()});
    save(); b.textContent = "Logged ✓"; b.style.background = "var(--ok)";
  }
  else if(a==="clog"){
    var min = +(document.getElementById("cmin").value||0);
    if(!min){ b.textContent = "Minutes?"; return; }
    S.cardio.push({
      t: Date.now(),
      a: document.getElementById("cact").value,
      min: min,
      mi: +(document.getElementById("cmi").value||0),
      lb: +(document.getElementById("clb").value||0),
      e: +document.getElementById("ceff").value
    });
    save(); render();
  }
  else if(a==="xlog"){
    var xn = document.getElementById("xn").value.trim();
    var xm = +(document.getElementById("xm").value||0);
    if(!xn){ b.textContent = "Exercise name?"; return; }
    if(!xm){ b.textContent = "Minutes?"; return; }
    S.custom.push({t:Date.now(), n:xn, min:xm, note:document.getElementById("xt").value.trim()});
    save(); render();
  }
  else if(a==="xdel"){
    if(confirm("Delete this entry?")){
      var tt = +b.dataset.t;
      S.custom = S.custom.filter(function(x){ return x.t !== tt; });
      save(); render();
    }
  }
  else if(a==="savecfg"){
    S.bw = +document.getElementById("bw").value || 200;
    S.protTarget = +document.getElementById("pt").value;
    S.heat = document.getElementById("heat").value;
    S.theme = document.getElementById("th").value;
    applyTheme(); save(); render();
  }
  else if(a==="export"){ doExport(b); }
});

function applyTheme(){
  if(S.theme==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.theme);
}

/* export — uses the downloads capability when the viewer has it */
var dl = null;
function doExport(btn){
  var json = JSON.stringify(S, null, 2);
  var name = "forge-backup-" + key() + ".json";
  if(dl){
    dl.save({filename:name, data:json}).then(function(){
      btn.textContent = "Saved ✓";
    }).catch(function(){
      btn.textContent = "Save declined";
    });
  } else {
    // fallback: open the data so it can be copied or shared
    try{
      var b = new Blob([json], {type:"application/json"});
      var u = URL.createObjectURL(b);
      var a = document.createElement("a");
      a.href = u; a.download = name; a.click();
      setTimeout(function(){ URL.revokeObjectURL(u); }, 2000);
      btn.textContent = "Exported ✓";
    }catch(e){ btn.textContent = "Export unavailable"; }
  }
}

/* ---------------- boot ---------------- */
(function(){
  var d = new Date();
  document.getElementById("today").textContent =
    d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"});
  applyTheme();
  render();
})();

if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("downloads").then(function(x){ dl = x; }).catch(function(){});
}
</script>

/* install the offline shell, and ask iOS not to evict the log */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then(function(p){ if(!p) navigator.storage.persist(); }).catch(function(){});
}
</script>
